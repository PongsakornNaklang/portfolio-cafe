<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAKANG</title>
  <meta name="description" content="Pongsakorn Naklang, software developer: a little 3D shop you can walk up to.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&family=Archivo:wdth,wght@125,800&display=swap">
  <style>
    :root { --ink: #2b2420; --paper: #fffdf7; --sign: #ffe100; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #bfe3ff; color: var(--ink); font: 15px/1.55 "Anuphan", system-ui, sans-serif; }
    body > canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #scroll { height: 400vh; }                       /* scroll distance = the walk to the shop */
    #hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px;
            background: var(--paper); box-shadow: 0 4px 14px rgba(0,0,0,.15); font-weight: 600; transition: opacity .4s; pointer-events: none; }
    #tip { position: fixed; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 13px;
           pointer-events: none; opacity: 0; transform: translate(-50%, -150%); transition: opacity .15s; white-space: nowrap; }
    .bubble { position: fixed; width: min(320px, calc(100vw - 32px)); padding: 16px 18px 18px; border-radius: 20px; background: var(--paper);
              box-shadow: 0 10px 30px rgba(0,0,0,.2); transform-origin: 50% 100%; animation: pop .22s cubic-bezier(.2,1.4,.4,1); }
    .bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -9px; width: 18px; height: 18px; background: var(--paper);
                     transform: translateX(-50%) rotate(45deg); border-radius: 0 0 4px 0; }
    .bubble[data-tail="up"]::after { bottom: auto; top: -9px; }
    .bubble[data-tail="left"]::after, .bubble[data-tail="right"]::after { left: auto; top: var(--tail); bottom: auto; transform: translateY(-50%) rotate(45deg); }
    .bubble[data-tail="left"]::after { left: -9px; }
    .bubble[data-tail="right"]::after { right: -9px; }
    .bubble[data-tail="none"]::after { display: none; }
    .bubble h2 { margin: 0 0 6px; font: 800 20px/1.1 "Archivo", sans-serif; font-stretch: 125%; }
    .bubble p { margin: 0; }
    .bubble table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .bubble td { padding: 5px 0; border-bottom: 1px dashed #d9d3c4; }
    .bubble td + td { text-align: right; color: #7a7266; }
    .bubble a.btn { display: inline-block; margin-top: 12px; padding: 7px 16px; border-radius: 999px; background: var(--sign); color: var(--ink);
                    font-weight: 600; text-decoration: none; }
    .bubble .x { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: #7a7266; }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }
    /* first-visit tutorial */
    #tour { position: fixed; inset: 0; display: grid; place-items: end center; padding: 0 16px 32px; background: rgba(20,18,16,.35); z-index: 5; }
    #tour[hidden] { display: none; }
    #tour .bubble { position: static; animation-duration: .28s; display: flex; flex-direction: column; min-height: 250px; } /* same height every step, so Next stays under the thumb */
    #tour .bubble::after { display: none; }
    #tour .step { font-size: 12px; color: #7a7266; margin-bottom: 4px; letter-spacing: .04em; }
    #tour .icon { font-size: 34px; line-height: 1; margin-bottom: 8px; }
    #tour .row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 14px; }
    #tour button { font: 600 14px "Anuphan", sans-serif; border: 0; cursor: pointer; border-radius: 999px; padding: 7px 16px; }
    #tour .skip { background: none; color: #7a7266; padding-left: 0; }
    #tour .next { background: var(--sign); color: var(--ink); }
    #help { position: fixed; right: 16px; bottom: 20px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper);
            box-shadow: 0 4px 14px rgba(0,0,0,.15); font: 800 18px "Archivo", sans-serif; cursor: pointer; z-index: 4; }
    #hint { white-space: nowrap; }
    #mute { position: fixed; right: 64px; bottom: 20px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper);
            box-shadow: 0 4px 14px rgba(0,0,0,.15); font-size: 17px; cursor: pointer; z-index: 4; }
    #tour { background: none; pointer-events: none; place-items: end start; padding: 0 16px 20px; }
    #tour .bubble { pointer-events: auto; min-height: 0; width: min(300px, calc(100vw - 32px)); padding: 12px 14px 12px; }
    #tour .bubble h2 { font-size: 17px; }
    #tour .bubble p { font-size: 14px; line-height: 1.45; }
    .bubble .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .bubble .acts .btn { margin: 0; border: 0; cursor: pointer; font: 600 14px "Anuphan", sans-serif; }
    #seatbar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
               padding: 8px 10px 8px 18px; border-radius: 999px; background: var(--paper); box-shadow: 0 6px 20px rgba(0,0,0,.2); z-index: 4;
               font-weight: 600; white-space: nowrap; }
    #seatbar[hidden] { display: none; }
    #seatbar #seat-move { background: #efe9dd; }
    #seatbar #seat-move[hidden] { display: none; }
    #seatbar .hint { color: #7a7266; font-weight: 400; font-size: 13px; }
    #seatbar button { font: 600 14px "Anuphan", sans-serif; border: 0; border-radius: 999px; padding: 7px 14px; background: var(--sign); cursor: pointer; }
    /* keep clear of the sound and ? buttons in the corner */
    @media (max-width: 960px) { #seatbar .hint { display: none; } }
    @media (max-width: 600px) { #hint { bottom: 72px; } }
    @media (max-width: 600px) { #seatbar { bottom: 72px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - 32px);
                                           border-radius: 22px; padding: 8px 10px; gap: 8px; } }
    /* the portfolio book: a yellow hardcover lying open, two pages a spread (one on a phone); a page turns on the spine */
    #book { border: 0; padding: 0; background: none; overflow: visible; max-width: none; max-height: none;
            width: min(880px, calc(100vw - 24px), calc((100dvh - 120px) * 1.45)); }
    #book::backdrop { background: rgba(20,18,16,.55); }
    body:has(dialog[open]) #hint { opacity: 0 !important; } /* the walk hint would show through behind a dialog's buttons */
    #book .cover { background: #f2c81d; border-radius: 10px; padding: 12px; box-shadow: inset 0 0 0 2px #d9b10f, 0 30px 80px rgba(0,0,0,.45); }
    #book .spread { position: relative; display: grid; grid-template-columns: 1fr 1fr; aspect-ratio: 1.45; perspective: 2400px;
                    box-shadow: 0 2px 0 #ece4d2, 0 4px 0 #ddd3bc, 0 6px 0 #e9e1cf; border-radius: 3px; cursor: pointer; }
    #book .spread.one { grid-template-columns: 1fr; aspect-ratio: auto; height: min(600px, calc(100dvh - 140px)); }
    #book .spread.one #pg-l { display: none; }
    #book .pg { position: relative; overflow: hidden auto; container-type: inline-size; padding: 26px 30px 36px; color: var(--ink);
                background-color: #fbf7ee; background-image: radial-gradient(#e6dfcd 1px, transparent 1.3px); background-size: 18px 18px; }
    /* the gutter: pages darken toward the spine */
    #book .pg.left { box-shadow: inset -26px 0 26px -18px rgba(60,40,10,.28); border-radius: 3px 0 0 3px; }
    #book .pg.right { box-shadow: inset 26px 0 26px -18px rgba(60,40,10,.28); border-radius: 0 3px 3px 0; }
    #book .spread.one .pg.right { box-shadow: inset 14px 0 18px -14px rgba(60,40,10,.3); border-radius: 0 3px 3px 0; }
    #book .pg.endpaper { background-color: #e9b80f; background-size: 24px 24px;
                         background-image: repeating-linear-gradient(0deg, rgba(43,36,32,.12) 0 5px, transparent 5px 24px),
                                           repeating-linear-gradient(90deg, rgba(43,36,32,.12) 0 5px, transparent 5px 24px); }
    #book .pg.title { background: #f2c81d; display: flex; flex-direction: column; justify-content: flex-end; }
    #book .title small { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    #book .title h1 { margin: 6px 0 4px; font: 800 12cqi/.95 "Archivo", sans-serif; font-stretch: 125%; }
    #book .title p { margin: 0 0 18px; }
    #book .title .hint { font-size: 13px; opacity: .7; }
    /* the turning leaf: two faces back to back, hinged on the spine */
    #book .leaf { position: absolute; top: 0; bottom: 0; width: 50%; transform-style: preserve-3d; z-index: 2; pointer-events: none; }
    #book .leaf.on-right { left: 50%; transform-origin: 0 50%; }
    #book .leaf.on-left { left: 0; transform-origin: 100% 50%; }
    #book .spread.one .leaf { left: 0; width: 100%; transform-origin: 0 50%; }
    #book .leaf .pg { position: absolute; inset: 0; backface-visibility: hidden; overflow: hidden; }
    #book .leaf .back { transform: rotateY(180deg); }
    #book .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #7a7266; margin-bottom: 6px; }
    #book h2 { margin: 0 0 10px; font: 800 28px/1.05 "Archivo", sans-serif; font-stretch: 125%; }
    #book p { margin: 0 0 6px; line-height: 1.5; }
    #book table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    #book td { padding: 4px 0; border-bottom: 1px dashed #d9d3c4; font-size: 14px; line-height: 1.3; }
    #book td + td { text-align: right; color: #7a7266; }
    #book a.btn { display: inline-block; margin-top: 14px; padding: 7px 16px; border-radius: 999px; background: var(--sign); color: var(--ink); font-weight: 600; text-decoration: none; }
    #book .folio { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 12px; color: #a39a8a; }
    #book ol.toc { list-style: none; padding: 0; margin: 8px 0 0; }
    #book .toc button { display: flex; width: 100%; align-items: baseline; gap: 6px; padding: 7px 0; border: 0; background: none; font: 500 16px "Anuphan", sans-serif; color: var(--ink); cursor: pointer; text-align: left; }
    #book .toc button:hover span { text-decoration: underline; }
    #book .toc i { flex: 1; border-bottom: 2px dotted #cfc6b2; }
    #book .tools { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
    #book .tools button { font: 600 14px "Anuphan", sans-serif; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; background: #fffdf7; color: var(--ink); }
    #book .tools button:disabled { opacity: .4; cursor: default; }
    #book .x { position: absolute; top: -40px; right: 0; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #fffdf7; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink); }
    @media (max-width: 720px) { #book .pg { padding: 22px 22px 34px; } #book h2 { font-size: 24px; } }
    /* guestbook drawing window */
    #board { border: 0; border-radius: 20px; padding: 16px; background: var(--paper); width: min(760px, calc(100vw - 32px), calc((100dvh - 210px) * 1.5 + 44px)); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    #board::backdrop { background: rgba(20,18,16,.45); }
    #board h2 { margin: 0 0 4px; font: 800 20px/1.1 "Archivo", sans-serif; font-stretch: 125%; }
    #board p { margin: 0 0 10px; color: #7a7266; font-size: 14px; }
    #board-canvas { display: block; width: 100%; aspect-ratio: 3 / 2; border-radius: 8px; border: 6px solid #c9a46c; touch-action: none; cursor: crosshair; background: #2b4c8c; }
    #board .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
    #board .ink { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); cursor: pointer; }
    #board .ink[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
    #board .ink.eraser { background: #2b4c8c; color: #fff; font-size: 13px; }
    #board .spacer { flex: 1; }
    #board button.txt { font: 600 14px "Anuphan", sans-serif; border: 0; border-radius: 999px; padding: 7px 16px; cursor: pointer; background: #ece7dc; color: var(--ink); }
    #board button.done { background: var(--sign); }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #bfe3ff; font: 800 22px "Archivo", sans-serif;
               font-stretch: 125%; transition: opacity .5s; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="scroll"></div>
  <div id="hint">Scroll to walk to the shop ↓</div>
  <div id="tip"></div>
  <button id="help" aria-label="How to use this page">?</button>
  <button id="mute" aria-label="Sound on or off">🔊</button>
  <div id="seatbar" hidden><span id="seat-title"></span><span class="hint" id="seat-hint">Tap your drink to sip</span><button id="seat-move">Change seat</button><button id="seat-leave">Back to the street</button></div>
  <div id="tour" hidden role="dialog" aria-modal="true" aria-labelledby="tour-title">
    <div class="bubble">
      <div class="step" id="tour-step"></div>
      <div class="icon" id="tour-icon" aria-hidden="true"></div>
      <h2 id="tour-title"></h2>
      <p id="tour-body"></p>
      <div class="row"><button class="skip" id="tour-skip">Skip</button><span><button class="skip" id="tour-back" hidden>Back</button> <button class="next" id="tour-next">Next</button></span></div>
    </div>
  </div>
  <dialog id="book" aria-label="Portfolio">
    <button class="x" id="book-close" aria-label="Close">×</button>
    <div class="cover"><div class="spread" id="book-spread"><div class="pg left" id="pg-l"></div><div class="pg right" id="pg-r"></div></div></div>
    <div class="tools"><button id="book-prev">← Back</button><button id="book-next">Next →</button></div>
  </dialog>
  <dialog id="board" aria-labelledby="board-title">
    <h2 id="board-title">Leave a note</h2>
    <p>Draw or write anything with your mouse or finger, then stick it on the board.</p>
    <canvas id="board-canvas" width="900" height="600"></canvas>
    <div class="tools">
      <button class="ink" data-ink="#f4f2ec" style="background:#f4f2ec" aria-label="White chalk" aria-pressed="true"></button>
      <button class="ink" data-ink="#f39cc0" style="background:#f39cc0" aria-label="Pink chalk" aria-pressed="false"></button>
      <button class="ink" data-ink="#ffd93b" style="background:#ffd93b" aria-label="Yellow chalk" aria-pressed="false"></button>
      <button class="ink" data-ink="#9fd0f2" style="background:#9fd0f2" aria-label="Light blue chalk" aria-pressed="false"></button>
      <button class="ink eraser" data-ink="#2b4c8c" aria-label="Eraser" aria-pressed="false">⌫</button>
      <span class="spacer"></span>
      <button class="txt" id="board-clear">Clear</button>
      <button class="txt" id="board-cancel">Cancel</button>
      <button class="txt done" id="board-done">Stick it on the board</button>
    </div>
  </dialog>
  <div id="loading">NAKANG</div>
  <script type="module" src="main.js?v=28"></script>
</body>
</html>
